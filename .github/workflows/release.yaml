name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io (docker)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push validator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: validator
          file: validator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/arnica-io/scylla-readiness-validator:${{ steps.version.outputs.version }}
            ghcr.io/arnica-io/scylla-readiness-validator:latest

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to ghcr.io (helm)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin

      - name: Pin validator image tag to this release
        run: |
          sed -i -E "s#(scylla-readiness-validator):[0-9A-Za-z._-]+#\1:${VERSION}#" values.yaml
          grep -n "scylla-readiness-validator:" values.yaml

      - name: Package chart
        run: helm package . --version "${VERSION}" --app-version "${VERSION}"

      - name: Push chart to OCI registry
        run: helm push "scylla-readiness-check-${VERSION}.tgz" oci://ghcr.io/arnica-io
